<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thermostat</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#1d1d1f;--mute:#6e6e73;--line:#e3e3e0;--acc:#d9480f;--ok:#2b8a3e;--err:#c92a2a}
@media (prefers-color-scheme:dark){:root{--bg:#161617;--card:#232325;--fg:#f2f2f2;--mute:#9a9aa0;--line:#38383b;--acc:#ff8a4c;--ok:#69db7c;--err:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:0 0 6px}
.big{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.big b{font-size:34px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{flex:1}
.q{color:var(--mute);font-size:12px}
select,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
input[type=number]{width:90px;text-align:right}
button{font:inherit;border:0;border-radius:8px;padding:6px 12px;background:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:4px 2px;text-align:left;border-top:1px solid var(--line)}
th{color:var(--mute);font-weight:500}
#msg{min-height:20px;font-size:13px}
.ok{color:var(--ok)}.err{color:var(--err)}.heat{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1 id="name">Thermostat</h1>
<div class="sub" id="sub">loading…</div>
<div id="msg"></div>

<div class="card">
<h2>Now</h2>
<div class="big"><div>Floor <b id="cur">–</b></div><div>Target <b id="tgt">–</b></div><div id="state"></div></div>
<div id="fault" class="err"></div>
</div>

<div class="card">
<h2>Control</h2>
<div class="row"><label>Power</label><select data-dp="1"><option value="1">On</option><option value="0">Off</option></select></div>
<div class="row"><label>Mode</label><select data-dp="2"><option value="2">Manual</option><option value="1">Schedule</option><option value="0">Holiday</option></select></div>
<div class="row"><label>Target °C</label><input type="number" data-dp="16" data-scale="10" min="5" max="40" step="0.5"><button data-set="16">Set</button></div>
<div class="row"><label>Child lock</label><select data-dp="108"><option value="0">Off</option><option value="1">On</option></select></div>
</div>

<div class="card">
<h2>Settings</h2>
<div class="row"><label>Hysteresis</label><select data-dp="114"><option value="0">0.5 °C</option><option value="1">1 °C</option><option value="2">2 °C</option><option value="3">3 °C</option></select></div>
<div class="row"><label>Sensor <span class="q">(mapping unconfirmed)</span></label><select data-dp="111"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></div>
<div class="row"><label>Floor calibration °C <span class="q">(±9)</span></label><input type="number" data-dp="113" data-scale="10" min="-9" max="9" step="0.1"><button data-set="113">Set</button></div>
<div class="row"><label>Room calibration °C <span class="q">(±9)</span></label><input type="number" data-dp="112" data-scale="10" min="-9" max="9" step="0.1"><button data-set="112">Set</button></div>
<div class="row"><label>Holiday days</label><input type="number" data-dp="109" min="0" max="99" step="1"><button data-set="109">Set</button></div>
<div class="row"><label>Adaptive <span class="q">(meaning unconfirmed)</span></label><input type="number" data-dp="110" min="0" max="100" step="1"><button data-set="110">Set</button></div>
</div>

<div class="card">
<h2>Weekly schedule <span class="q">(read-only for now; edit on the thermostat)</span></h2>
<table id="sched"></table>
</div>

<div class="card">
<h2>Info</h2>
<table id="info"></table>
</div>
</main>
<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let st=null,busy=0;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const c=v=>v==null?"–":(v/10).toFixed(1)+"°";
function msg(t,cls){const m=$("#msg");m.textContent=t;m.className=cls||""}
function sched(hex){
  if(!hex||hex.length<42)return null;
  const b=hex.match(/../g).map(x=>parseInt(x,16)),p=[];
  for(let i=1;i+4<b.length;i+=5)p.push({t:String(b[i+1]).padStart(2,"0")+":"+String(b[i+2]).padStart(2,"0"),c:((b[i+3]<<8|b[i+4])/10).toFixed(1)});
  return p;
}
function render(){
  const d=st.dp;
  $("#name").textContent=st.name;
  $("#sub").textContent="firmware "+st.fw+" · up "+Math.floor(st.uptime/3600)+" h "+Math.floor(st.uptime%3600/60)+" min";
  $("#cur").textContent=c(d.current);$("#tgt").textContent=c(d.setpoint);
  $("#state").innerHTML=d.switch===0?"Off":d.heating===1?'<span class="heat">Heating</span>':"Idle";
  $("#fault").textContent=d.fault?"Sensor fault ("+d.fault+")":"";
  const byId={1:"switch",2:"mode",16:"setpoint",108:"lock",109:"holiday_days",110:"adaptive",111:"sensor",112:"room_comp",113:"floor_comp",114:"hysteresis"};
  for(const el of $$("[data-dp]")){
    if(el===document.activeElement)continue;
    const v=d[byId[el.dataset.dp]];if(v==null)continue;
    el.value=el.dataset.scale?v/el.dataset.scale:v;
  }
  const rows=st.schedule.map((h,i)=>{const p=sched(h);return"<tr><th>"+DAYS[i]+"</th>"+(p?p.map(x=>"<td>"+x.t+" "+x.c+"°</td>").join(""):"<td colspan=4>–</td>")+"</tr>"});
  $("#sched").innerHTML=rows.join("");
  const info=[["Heater power",d.power_w!=null?d.power_w+" W":"–"],["Heating time",d.heating_time!=null?d.heating_time+' <span class="q">(h?)</span>':"–"],
    ["Floor limit",d.floor_limit!=null?d.floor_limit+' <span class="q">(raw, scale unconfirmed)</span>':"–"],["Display unit",d.fahrenheit?"°F":"°C"],
    ["Memory free",Math.round(st.heap/1024)+" KiB (min "+Math.round(st.heapMin/1024)+")"]];
  for(const k in st.other)info.push(["DP "+k,String(st.other[k])]);
  $("#info").innerHTML=info.map(r=>"<tr><th>"+r[0]+"</th><td>"+r[1]+"</td></tr>").join("");
}
async function load(){
  try{const r=await fetch("/api/state");st=await r.json();render()}catch(e){msg("Can't reach the thermostat","err")}
}
async function write(dp,v){
  busy++;msg("Sending…");
  try{
    const r=await fetch("/api/dp",{method:"POST",headers:{"X-Requested-With":"web","Content-Type":"application/x-www-form-urlencoded"},body:"dp="+dp+"&v="+v});
    const t=await r.text();r.ok?msg("Sent","ok"):msg(t,"err");
  }catch(e){msg("Can't reach the thermostat","err")}
  busy--;setTimeout(load,1200);
}
function valueOf(el){const n=Number(el.value);return el.dataset.scale?Math.round(n*el.dataset.scale):Math.round(n)}
for(const el of $$("select[data-dp]"))el.addEventListener("change",()=>write(el.dataset.dp,valueOf(el)));
for(const b of $$("button[data-set]"))b.addEventListener("click",()=>{
  const el=$('input[data-dp="'+b.dataset.set+'"]');
  if(el.value.trim()===""||!Number.isFinite(Number(el.value))){msg("Enter a number first","err");return} // Number("") is 0
  write(b.dataset.set,valueOf(el))});
load();
setInterval(()=>{if(document.visibilityState==="visible"&&!busy)load()},10000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
</script>
</body>
</html>
